<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/job-postings">
    <mat-icon class="brand-icon" aria-hidden="true">work</mat-icon>
    <span>CivicJobs</span>
  </a>

  <span class="spacer"></span>

  @if (auth.isAuthenticated()) {
    @if (auth.currentUser(); as user) {
      <span class="user-name" data-testid="user-name">{{ user.fullName }}</span>
    }
    <button mat-button type="button" (click)="auth.logout()">Log out</button>
  } @else {
    <a mat-button routerLink="/open-positions" routerLinkActive="active-link" ariaCurrentWhenActive="page">Open positions</a>
    <a mat-button routerLink="/login" routerLinkActive="active-link" ariaCurrentWhenActive="page">Log in</a>
  }
</mat-toolbar>

<main>
  <router-outlet />
</main>
