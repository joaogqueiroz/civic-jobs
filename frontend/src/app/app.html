<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/job-postings">
    <mat-icon aria-hidden="true">work</mat-icon>
    <span>CivicJobs</span>
  </a>

  <span class="spacer"></span>

  @if (auth.isAuthenticated()) {
    @if (auth.currentUser(); as user) {
      <span class="user-name" data-testid="user-name">{{ user.fullName }}</span>
    }
    <button mat-icon-button type="button" (click)="auth.logout()" aria-label="Log out">
      <mat-icon>logout</mat-icon>
    </button>
  }
</mat-toolbar>

<main>
  <router-outlet />
</main>
