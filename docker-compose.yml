# Runs the whole app: docker compose up --build, then open http://localhost:4200
services:
  identity-api:
    build:
      context: ./backend
      dockerfile: CivicJobs.Identity.Api/Dockerfile
    ports:
      - "5101:8080"
    environment:
      # Development enables Swagger, the demo seed and the clearly fake JWT key in appsettings.Development.json.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CivicJobs: Data Source=/data/civicjobs.db
    volumes:
      - civicjobs-data:/data

  jobs-api:
    build:
      context: ./backend
      dockerfile: CivicJobs.Jobs.Api/Dockerfile
    ports:
      - "5102:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CivicJobs: Data Source=/data/civicjobs.db
    volumes:
      - civicjobs-data:/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - identity-api
      - jobs-api

volumes:
  # One SQLite file shared by both APIs, like backend/civicjobs.db when running locally.
  civicjobs-data:
